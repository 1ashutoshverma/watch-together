<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Watch Together</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        height: 100vh;
        overflow: hidden; /* 🔑 prevent page scroll */
      }

      h2 {
        margin: 6px 0;
        text-align: center;
        font-size: 15px;
      }

      /* ROOT LAYOUT */
      .page {
        height: calc(100vh - 28px);
        display: flex;
      }

      /* VIDEO SECTION */
      .video-wrapper {
        flex: 1;
        background: black;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* CHAT SECTION */
      .chat-wrapper {
        width: 200px; /* ✅ DESKTOP WIDTH */
        display: flex;
        flex-direction: column;
        border-left: 1px solid #333;
        background: #111;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto; /* ✅ only chat scrolls */
        padding: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .chat-input {
        display: flex;
        position: sticky; /* ✅ stays above keyboard */
        bottom: 0;
        background: #111;
        border-top: 1px solid #333;
      }

      .chat-input input {
        flex: 1;
        padding: 12px;
        border: none;
        outline: none;
        background: #222;
        color: #fff;
        font-size: 16px; /* prevents iOS zoom */
      }

      .chat-input button {
        width: 60px;
        border: none;
        background: #444;
        color: #fff;
      }

      /* CHAT BUBBLES */
      .msg {
        margin: 6px 0;
        max-width: 85%;
        word-wrap: break-word;
        font-size: 14px;
      }

      .me {
        align-self: flex-end;
        background: #2a7cff;
        padding: 6px 8px;
        border-radius: 12px 12px 0 12px;
      }

      .friend {
        align-self: flex-start;
        background: #333;
        padding: 6px 8px;
        border-radius: 12px 12px 12px 0;
      }

      /* 📱 MOBILE OVERRIDES */
      @media (max-width: 768px) {
        .page {
          flex-direction: column; /* video on top, chat below */
          height: auto; /* allow page to grow */
          position: fixed;
          top: 4px;
          left: 0;
          right: 0;
        }

        .video-wrapper {
          flex: 0 0 auto;
        }

        .chat-wrapper {
          width: 100%; /* full width chat */
          /* flex: 1; */
          border-left: none;
          border-top: 1px solid #333;
          height: 228px;
        }
      }

      /* ===== Desktop chat scrollbar (dark) ===== */
      .chat-messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: #111; /* same as chat background */
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background-color: #444;
        border-radius: 4px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background-color: #666;
      }

      /* Firefox support */
      .chat-messages {
        scrollbar-width: thin;
        scrollbar-color: #444 #111;
      }
    </style>
  </head>

  <body>
    <h2>🎬 Watch Together</h2>

    <div class="page">
      <!-- VIDEO -->
      <div class="video-wrapper">
        <video id="video" controls playsinline>
          <source src="/video" type="video/mp4" />
        </video>
      </div>

      <!-- CHAT (RIGHT SIDE ON DESKTOP) -->
      <div class="chat-wrapper">
        <div id="chat" class="chat-messages"></div>
        <div class="chat-input">
          <input id="msg" placeholder="Type message..." />
          <button onclick="send()">Send</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

    <script>
      // ENTER KEY SEND
      document.getElementById("msg").addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });
    </script>
  </body>
</html>
