<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Just us</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Just us" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <main class="page" id="page">
        <section class="stage" id="stage">
          <video id="video" playsinline controls preload="auto"></video>

          <div class="empty" id="empty">
            <h2>Pick something to watch together</h2>
            <p>Paste a link from almost any site, play a movie from the Mac, or sync Netflix and other apps.</p>
            <div class="row">
              <button class="btn" data-open="link">Paste link</button>
              <button class="btn ghost" data-open="library">Library</button>
            </div>
          </div>

          <div class="card" id="extCard" hidden>
            <h2 id="extTitle"></h2>
            <p id="extHint"></p>
            <div class="time" id="extTime"></div>
            <div class="row">
              <button class="btn" id="cdPlay">Play together</button>
              <button class="btn ghost" id="cdPause">Pause together</button>
              <button class="btn ghost" id="extStop">Done</button>
            </div>
          </div>

          <div class="card" id="shareCard" hidden>
            <h2>You're sharing a tab</h2>
            <p>Play the video in that tab. Sound and picture go straight to the other screen.</p>
            <div class="row"><button class="btn" id="stopShare">Stop sharing</button></div>
          </div>

          <p class="status" id="status" hidden></p>
          <button class="tap" id="tap" hidden><span>Tap to sync</span></button>

          <div class="stage-tools">
            <button class="icon-btn" id="fullBtn" title="Full screen with chat (F)" aria-label="Full screen with chat">
              <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
              <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <button class="icon-btn" data-menu title="Menu" aria-label="Menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
          </div>

          <div class="overlay-chat" id="overlayChat">
            <div class="overlay-msgs" id="overlayMsgs"></div>
            <form id="overlayForm" autocomplete="off"><input id="overlayInput" placeholder="Say something…" enterkeyhint="send" aria-label="Message" /></form>
          </div>
        </section>

        <aside class="chat" id="chat">
          <header class="chat-head">
            <div class="seats" id="seats"></div>
            <span class="typing" id="typing"></span>
            <button class="icon-btn flat" data-menu title="Menu" aria-label="Menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
          </header>
          <div class="messages" id="messages"><p class="msg-empty" id="msgEmpty">Messages stay on this Mac only while it's running.</p></div>
          <form class="compose" id="compose" autocomplete="off">
            <input id="msg" placeholder="Message" enterkeyhint="send" aria-label="Message" />
            <button type="submit">Send</button>
          </form>
        </aside>
      </main>
    </div>

    <div class="sheet-backdrop" id="sheet" hidden></div>
    <div class="countdown" id="countdown" hidden></div>
    <div class="panic-cover" id="panicCover" hidden>double tap</div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
