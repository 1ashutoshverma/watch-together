<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 300px; background: #1a1220; color: #f4ebf2; font: 14px/1.4 system-ui, sans-serif; }
      form { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h1 { font: 600 18px/1 ui-rounded, system-ui, sans-serif; margin: 0 0 2px; }
      p { margin: 0; color: #ab9bb3; font-size: 13px; }
      label { display: flex; flex-direction: column; gap: 4px; color: #ab9bb3; font-size: 13px; }
      input { background: #241a2c; border: 1px solid #3d2f49; border-radius: 10px; padding: 9px 10px; color: #f4ebf2; font-size: 14px; outline: none; }
      input:focus { border-color: #f2a65a; }
      button { border: 0; border-radius: 999px; padding: 10px; background: #f2a65a; color: #2a1708; font-weight: 600; cursor: pointer; }
      .msg { min-height: 18px; font-size: 13px; }
      .ok { color: #9fe0a8; }
      .err { color: #ff9a9a; }
    </style>
  </head>
  <body>
    <form id="f">
      <h1>Just us sync</h1>
      <p>Use the link the Mac printed when you ran npm start.</p>
      <label>Room link<input id="server" placeholder="https://….trycloudflare.com" required /></label>
      <label>Your name<input id="name" maxlength="24" required /></label>
      <label>Room password<input id="password" type="password" required /></label>
      <button>Connect</button>
      <div class="msg" id="msg"></div>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
